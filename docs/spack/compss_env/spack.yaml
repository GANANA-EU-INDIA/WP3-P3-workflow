spack:
    specs:
    - python@3.11
    - openjdk
    - boost
    - libxml2
    - zlib@1.2
    - autoconf
    - automake
    - libtool
    - m4
    - py-setuptools
    - compss
    view: false
    concretizer:
        unify: true
        reuse: true
    repos:
    - $SPACK_ROOT/var/spack/repos/builtin
    - path/to/custom/repos