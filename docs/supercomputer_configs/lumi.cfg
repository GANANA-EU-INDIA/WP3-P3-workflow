################################
## STRUCTURE VARIABLES
################################

QUEUE_SYSTEM="slurm" #from queues/

################################
## ENQUEUE_COMPSS VARIABLES
################################

DEFAULT_EXEC_TIME=10
DEFAULT_NUM_NODES=2
DEFAULT_NUM_SWITCHES=0
MAX_NODES_SWITCH=18
MIN_NODES_REQ_SWITCH=4
# LUMI-G: standard-g (full nodes), small-g (sub-node), dev-g (debug)
DEFAULT_QUEUE=standard-g
DEFAULT_MAX_TASKS_PER_NODE=-1
# 64-core EPYC 7A53, but low-noise mode leaves 56 usable cores
DEFAULT_CPUS_PER_NODE=56
DEFAULT_FORWARD_CPUS_PER_NODE="false"
DEFAULT_IO_EXECUTORS=0
# 4x MI250X = 8 GCDs, each seen by Slurm as one GPU
DEFAULT_GPUS_PER_NODE=8
DEFAULT_WORKER_IN_MASTER_CPUS=0
DEFAULT_WORKER_IN_MASTER_MEMORY=disabled
DEFAULT_JOB_EXECUTION_DIR=.
# No local disk on LUMI-G; local_disk resolves to /tmp (RAM-backed), see LOCAL_DISK_PREFIX
DEFAULT_WORKER_WORKING_DIR=local_disk
# Slingshot-11; no HSN hostname suffix documented, so plain hostnames
DEFAULT_NETWORK=ethernet
DEFAULT_FPGAS_PER_NODE=0
DEFAULT_DEPENDENCY_JOB=None
DEFAULT_RESERVATION=disabled
DEFAULT_NODE_MEMORY=disabled
DEFAULT_JVM_MASTER=""
DEFAULT_JVM_WORKERS="-Xms24800m,-Xmx24800m,-Xmn1600m"
DEFAULT_JVM_WORKER_IN_MASTER=""
# 512 GiB DDR4 per LUMI-G node
DEFAULT_NODE_MEMORY_SIZE=512
DEFAULT_NODE_STORAGE_BANDWIDTH=""

################################
## Enabling/disabling passing
## options to the queue system
################################

DISABLE_QARG_MEMORY=false
DISABLE_QARG_CONSTRAINTS=true
DISABLE_QARG_LICENSES=true
DISABLE_QARG_QOS=true
DISABLE_QARG_CPUS_PER_TASK=false
DISABLE_QARG_NVRAM=true

################################
## SUBMISSION VARIABLES
################################

MINIMUM_NUM_NODES=2
MINIMUM_CPUS_PER_NODE=1
DEFAULT_STORAGE_HOME="null"
DISABLED_STORAGE_HOME="null"

################################
## LAUNCH VARIABLES
################################

# /tmp is in RAM on LUMI compute nodes and counts toward the job memory allocation
LOCAL_DISK_PREFIX="/tmp/"
REMOTE_EXECUTOR="none"
NETWORK_INFINIBAND_SUFFIX=""
NETWORK_DATA_SUFFIX="-data"
# Lustre: /scratch/project_<id>, /project/project_<id> (also /flash, /users)
SHARED_DISK_PREFIX="/scratch/"
SHARED_DISK_2_PREFIX="/project/"
MASTER_NAME_CMD=hostname
