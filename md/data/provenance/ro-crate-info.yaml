COMPSs Workflow Information:
  name: MD-proteins-in-water
  description: Setup and MD simulations of a NVT ensemble of a small peptide in water. From the PDB to the trajectory analysis. Based on the GROMACS official tutorial on simple MD simulation. Original authors are Cathrine Bergh, Maryam Majdolhosseini and Alessandra Villa.
  license: Attribution 4.0 International
  sources: [relative_path_to/dir_2/]
  data_persistence: False # this avoids copying inputs and outputs in teh ro file
  trace_persistence: False # is related to copying the traces for the BSC software
  software:
    - name: md-tutorial-gromacs
      version: v3
      url: https://zenodo.org/records/14803238

